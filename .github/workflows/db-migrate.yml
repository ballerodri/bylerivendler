name: Supabase DB migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch: {}

concurrency:
  group: supabase-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Bootstrap: estas migraciones se corrieron a mano vía SQL Editor, así que
      # las marcamos como aplicadas para que el CLI no intente reaplicarlas.
      # Idempotente (|| true): a partir de la segunda corrida es un no-op.
      - name: Bootstrap migration history
        run: |
          supabase migration repair --status applied 20260504120000 || true
          supabase migration repair --status applied 20260619000000 || true
          supabase migration repair --status applied 20260620000001 || true
          supabase migration repair --status applied 20260620000002 || true

      # `--yes` tampoco: el CLI nuevo pide confirmar antes de tocar produccion
      # y aca no hay nadie para contestarle ("stdout is not a terminal").
      # Confirmar es justamente lo que este workflow viene a hacer: corre solo
      # cuando se empuja una migracion a main.
      #
      # `--remote` NO es opcional: las versiones nuevas del CLI apuntan por
      # defecto a una base LOCAL (127.0.0.1:54322), que en el runner no existe,
      # y el paso muere con "ECONNREFUSED". El propio CLI lo dice: "To use the
      # linked project instead, pass --remote."
      - name: Push migrations
        run: supabase db push --include-all --remote --yes
